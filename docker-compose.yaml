version: '3.8'


services:
  vllm-inference:
    image: vllm/vllm-openai:latest
    container_name: private-vllm-engine
    runtime: nvidia
    environment:
      # Enforce strict offline mode (Blocks Hugging Face telemetry and web queries)
      - HF_HUB_OFFLINE=1
      # Points vLLM to the internal model path inside the container
      - MODEL_PATH=/root/.cache/huggingface/hub/Llama-3.2-3B-Instruct
    volumes:
      # Mount your local pre-downloaded weights directory into the container
      - ~/Documents/models/Meta-Llama-3-8B-Instruct:/root/.cache/huggingface/hub/Llama-3.2-3B-Instruct
    ports:
      # Exposes the OpenAI-compatible API endpoint to your internal network only
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Allocates all available on-prem GPUs to the container
              capabilities: [gpu]
    restart: unless-stopped
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model ./models/Llama-3.2-3B-Instruct
      --host 0.0.0.0
      --port 8000
      --api-key your-internal-secure-gateway-token-xyz
      --disable-log-requests
      --max-model-len 8192
